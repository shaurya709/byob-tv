<!doctype html>
<!-- @dsCard group="Colors" name="Tints & shades" subtitle="Mint 300 · Green 200/600 · Tangerine 200/600 · White" viewport="700x150" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg1);font-family:var(--font-sans);}
  .card{padding:20px 24px;width:700px;box-sizing:border-box;}
  .eyebrow{font:var(--t-overline);text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);margin-bottom:10px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .sw{border-radius:8px;padding:10px 12px;min-height:58px;display:flex;align-items:center;font:var(--t-caption);font-family:var(--font-mono);}
</style></head><body>
<div class="card">
  <div class="eyebrow">Tints & shades</div>
  <div class="grid">
    <!-- Row 1: shades -->
    <div class="sw" style="background:#0C1919;color:#E4F3E7">#0C1919</div>
    <div class="sw" style="background:#AFCBB5;color:#112121">#AFCBB5</div>
    <div class="sw" style="background:#43AF68;color:#fff">#43AF68</div>
    <div class="sw" style="background:#CB853C;color:#fff">#CB853C</div>
    <!-- Row 2: base -->
    <div class="sw" style="background:#112121;color:#E4F3E7">#112121</div>
    <div class="sw" style="background:#E4F3E7;color:#112121">#E4F3E7</div>
    <div class="sw" style="background:#6ED190;color:#112121">#6ED190</div>
    <div class="sw" style="background:#F6AF65;color:#112121">#F6AF65</div>
    <!-- Row 3: tints -->
    <div class="sw" style="background:#1E3636;color:#E4F3E7">#1E3636</div>
    <div class="sw" style="background:#FFFFFF;color:#112121;border:1px solid var(--border)">#FFFFFF</div>
    <div class="sw" style="background:#AFF2C6;color:#112121">#AFF2C6</div>
    <div class="sw" style="background:#FAC995;color:#112121">#FAC995</div>
  </div>
</div>
</body></html>
