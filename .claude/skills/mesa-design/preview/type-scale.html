<!doctype html>
<!-- @dsCard group="Type" name="Type scale (semantic)" subtitle="display-1 · h1 · h3 · lead · body · overline" viewport="700x280" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--bg);font-family:var(--font-sans);}
.card{padding:22px 26px;width:700px;box-sizing:border-box;}
.eyebrow{font:var(--t-overline);text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);margin-bottom:18px;}
.item{display:grid;grid-template-columns:140px 1fr auto;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--border);}
.item:last-child{border-bottom:none;}
.k{font:var(--t-caption);font-family:var(--font-mono);color:var(--fg3);}
.v{color:var(--fg1);}
.m{font:var(--t-caption);font-family:var(--font-mono);color:var(--fg3);}
</style></head><body>
<div class="card">
  <div class="eyebrow">Type scale · semantic</div>
  <div class="item"><span class="k">display-1</span><span class="v" style="font:var(--t-display-1);letter-spacing:-.02em;font-size:52px">Build it.</span><span class="m">700 · 96/.98</span></div>
  <div class="item"><span class="k">h1</span><span class="v" style="font:var(--t-h1);letter-spacing:-.01em;font-size:34px">Learn to lead a startup</span><span class="m">700 · 56/1.05</span></div>
  <div class="item"><span class="k">h3</span><span class="v" style="font:var(--t-h3);letter-spacing:-.01em">Section headline</span><span class="m">600 · 28/1.22</span></div>
  <div class="item"><span class="k">lead</span><span class="v" style="font:var(--t-lead);color:var(--fg2)">A twelve-month program for founders.</span><span class="m">400 · 20/1.5</span></div>
  <div class="item"><span class="k">body</span><span class="v" style="font:var(--t-body);color:var(--fg2)">Standard body copy at 16px Manrope Regular.</span><span class="m">400 · 16/1.55</span></div>
  <div class="item"><span class="k">overline</span><span class="v" style="font:var(--t-overline);text-transform:uppercase;letter-spacing:.12em;color:var(--fg3)">COHORT 02 · 2026</span><span class="m">700 · 11/1.2</span></div>
</div>
</body></html>
