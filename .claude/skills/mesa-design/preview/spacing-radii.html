<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="xs 6 · sm 10 · md 16 · lg 24 · xl 32 · pill" viewport="700x160" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--bg);font-family:var(--font-sans);}
.card{padding:22px 26px;width:700px;box-sizing:border-box;}
.eyebrow{font:var(--t-overline);text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);margin-bottom:14px;}
.row{display:flex;gap:14px;align-items:flex-end;}
.cell{flex:1;text-align:center;}
.sq{background:var(--deep-forest-green);margin:0 auto;width:84px;height:56px;}
.lbl{font:var(--t-caption);font-family:var(--font-mono);color:var(--fg3);margin-top:8px;}
</style></head><body>
<div class="card">
  <div class="eyebrow">Radii · corner scale</div>
  <div class="row">
    <div class="cell"><div class="sq" style="border-radius:6px"></div><div class="lbl">xs · 6</div></div>
    <div class="cell"><div class="sq" style="border-radius:10px"></div><div class="lbl">sm · 10</div></div>
    <div class="cell"><div class="sq" style="border-radius:16px"></div><div class="lbl">md · 16</div></div>
    <div class="cell"><div class="sq" style="border-radius:24px"></div><div class="lbl">lg · 24</div></div>
    <div class="cell"><div class="sq" style="border-radius:32px"></div><div class="lbl">xl · 32</div></div>
    <div class="cell"><div class="sq" style="border-radius:999px"></div><div class="lbl">pill</div></div>
  </div>
</div>
</body></html>
