<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px baseline: 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64" viewport="700x320" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--bg);font-family:var(--font-sans);}
.card{padding:22px 26px;width:700px;box-sizing:border-box;}
.eyebrow{font:var(--t-overline);text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);margin-bottom:14px;}
.row{display:flex;align-items:center;gap:18px;margin:10px 0;}
.chip{display:inline-flex;align-items:center;gap:10px;}
.box{background:var(--bright-green);border-radius:4px;}
.lbl{font:var(--t-caption);font-family:var(--font-mono);color:var(--fg3);}
</style></head><body>
<div class="card">
  <div class="eyebrow">Spacing scale · 4px baseline</div>
  <div class="row"><div class="box" style="width:4px;height:24px"></div><span class="lbl">--s-1 · 4px</span></div>
  <div class="row"><div class="box" style="width:8px;height:24px"></div><span class="lbl">--s-2 · 8px</span></div>
  <div class="row"><div class="box" style="width:12px;height:24px"></div><span class="lbl">--s-3 · 12px</span></div>
  <div class="row"><div class="box" style="width:16px;height:24px"></div><span class="lbl">--s-4 · 16px</span></div>
  <div class="row"><div class="box" style="width:24px;height:24px"></div><span class="lbl">--s-6 · 24px</span></div>
  <div class="row"><div class="box" style="width:32px;height:24px"></div><span class="lbl">--s-8 · 32px</span></div>
  <div class="row"><div class="box" style="width:48px;height:24px"></div><span class="lbl">--s-12 · 48px</span></div>
  <div class="row"><div class="box" style="width:64px;height:24px"></div><span class="lbl">--s-16 · 64px</span></div>
</div>
</body></html>
