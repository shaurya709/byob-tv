<!doctype html>
<!-- @dsCard group="Colors" name="Secondary & deep surfaces" subtitle="Deep Forest Green · Deep Teal · Charcoal 900/700" viewport="700x160" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg1);font-family:var(--font-sans);}
  .card{padding:20px 24px;width:700px;box-sizing:border-box;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:88px;border:1px solid var(--border);}
  .sw .name{font:var(--t-caption);font-weight:700;}
  .sw .hex{font:var(--t-caption);font-family:var(--font-mono);opacity:.8;}
  .eyebrow{font:var(--t-overline);text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);margin-bottom:10px;}
</style></head><body>
<div class="card">
  <div class="eyebrow">Secondary · deep surfaces</div>
  <div class="row">
    <div class="sw" style="background:#11403B;color:#E4F3E7;border-color:transparent"><div class="name">Deep Forest Green</div><div class="hex">#11403B</div></div>
    <div class="sw" style="background:#0B2E2A;color:#E4F3E7;border-color:transparent"><div class="name">Deep Teal</div><div class="hex">#0B2E2A</div></div>
  </div>
</div>
</body></html>
