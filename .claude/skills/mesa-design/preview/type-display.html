<!doctype html>
<!-- @dsCard group="Type" name="Display serif" subtitle="New York / MesaSerif — display, h2, italic quote" viewport="700x220" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--bg);}
.card{padding:22px 26px;width:700px;box-sizing:border-box;}
.eyebrow{font:var(--t-overline);text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);margin-bottom:14px;}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:6px 0;}
.lbl{font:var(--t-caption);font-family:var(--font-mono);color:var(--fg3);white-space:nowrap;}
.spec{font-family:var(--font-serif);color:var(--fg1);letter-spacing:-0.02em;}
</style></head><body>
<div class="card">
  <div class="eyebrow">Display serif · New York / MesaSerif</div>
  <div class="row"><div class="spec" style="font-weight:700;font-size:68px;line-height:1">Build it.</div><div class="lbl">display · 700 · 68/1</div></div>
  <div class="row"><div class="spec" style="font-weight:600;font-size:42px;line-height:1.1">Learn to lead a startup</div><div class="lbl">h2 · 600 · 42/1.1</div></div>
  <div class="row"><div class="spec" style="font-weight:600;font-style:italic;font-size:26px;line-height:1.2">"One cohort. Zero textbooks."</div><div class="lbl">h3 italic · 600</div></div>
</div>
</body></html>
