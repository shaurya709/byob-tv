<!doctype html>
<!-- @dsCard group="Colors" name="Semantic fg · dark" subtitle="fg tokens on Midnight Charcoal" viewport="700x220" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#112121;color:#fff;font-family:var(--font-sans);}
  .card{padding:20px 24px;width:700px;box-sizing:border-box;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .t{padding:14px 16px;border-radius:12px;background:rgba(228,243,231,0.06);border:1px solid rgba(255,255,255,.1);}
  .k{font:var(--t-overline);text-transform:uppercase;letter-spacing:.12em;color:#AFCBB5;margin-bottom:6px;}
  .v{font:var(--t-body-md);}
  .s{font:var(--t-caption);font-family:var(--font-mono);color:#8FA7A2;margin-top:2px;}
  .eyebrow{font:var(--t-overline);text-transform:uppercase;letter-spacing:.12em;color:#AFCBB5;margin-bottom:10px;}
</style></head><body>
<div class="card">
  <div class="eyebrow">Semantic foreground · dark surface</div>
  <div class="grid">
    <div class="t"><div class="k">fg1 · primary</div><div class="v" style="color:#fff">Learn to build, not to analyse.</div><div class="s">var(--fg1) · #FFFFFF</div></div>
    <div class="t"><div class="k">fg2 · secondary</div><div class="v" style="color:#AFCBB5">Twelve months. In-person.</div><div class="s">var(--fg2) · #AFCBB5</div></div>
    <div class="t"><div class="k">fg3 · tertiary</div><div class="v" style="color:#8FA7A2">Cohort 02 · 2026 intake</div><div class="s">var(--fg3) · #8FA7A2</div></div>
    <div class="t"><div class="k">accent</div><div class="v" style="color:#6ED190">Apply for Cohort 02 →</div><div class="s">var(--accent) · #6ED190</div></div>
  </div>
</div>
</body></html>
