<!doctype html>
<!-- @dsCard group="Brand" name="Logo · Undergraduate" subtitle="UG red on mint · UG white on charcoal" viewport="700x180" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--bg);font-family:var(--font-sans);}
.card{padding:22px 26px;width:700px;box-sizing:border-box;display:flex;gap:18px;align-items:center;}
.logo{background:#E4F3E7;border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:center;flex:1;min-height:110px;}
.logo img{max-width:100%;max-height:78px;object-fit:contain;}
.dark{background:#112121;}
.lbl{font:var(--t-overline);text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);margin-top:8px;text-align:center;}
.col{display:flex;flex-direction:column;flex:1;}
</style></head><body>
<div class="card">
  <div class="col"><div class="logo"><img src="../assets/logo-ug-red.png"></div><div class="lbl">Light bg · UG red</div></div>
  <div class="col"><div class="logo dark"><img src="../assets/logo-ug-white.png"></div><div class="lbl">Dark bg · UG white</div></div>
</div>
</body></html>
