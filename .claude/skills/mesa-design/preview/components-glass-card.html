<!doctype html>
<!-- @dsCard group="Components" name="Frosted-glass card" subtitle="Signature surface: blur + Deep Teal fill + brand mark" viewport="700x200" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#0B2E2A;font-family:var(--font-sans);}
  /* A subtle imagery backdrop so the glass effect is actually visible */
  .card{position:relative;padding:28px 30px;width:700px;box-sizing:border-box;color:#fff;overflow:hidden;}
  .bg{position:absolute;inset:0;background:
      radial-gradient(80% 60% at 20% 30%, rgba(110,209,144,0.35), transparent 70%),
      radial-gradient(70% 50% at 85% 80%, rgba(246,175,101,0.28), transparent 72%),
      radial-gradient(60% 50% at 60% 20%, rgba(175,242,198,0.22), transparent 70%),
      #0B2E2A;}
  .row{position:relative;display:flex;gap:18px;}
  .glass{flex:1;background:rgba(228,243,231,0.10);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
         border:1px solid rgba(255,255,255,0.14);border-radius:20px;padding:22px 24px;
         box-shadow:0 12px 30px rgba(11,46,42,0.28), inset 0 1px 0 rgba(255,255,255,0.18);}
  .eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--font-sans);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#AFF2C6;margin-bottom:12px;}
  .mark{width:22px;height:22px;display:block;}
  .h{font-family:var(--font-serif);font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0 0 8px;color:#fff;}
  .p{font-size:14px;color:rgba(228,243,231,0.78);line-height:1.5;margin:0;}
  .stat{display:flex;align-items:baseline;gap:8px;margin-top:14px;}
  .num{font-family:var(--font-serif);font-size:34px;font-weight:700;color:#6ED190;letter-spacing:-.02em;}
  .lbl{font-size:12px;color:rgba(228,243,231,0.7);letter-spacing:.06em;text-transform:uppercase;font-weight:600;}
</style></head><body>
<div class="card">
  <div class="bg"></div>
  <div class="row">
    <div class="glass">
      <div class="eyebrow"><img class="mark" src="../assets/brand-mark-solid-white.svg" alt="">Cohort 02 · 2026</div>
      <div class="h">Twelve months. One city.</div>
      <div class="p">Learn in-person in Bengaluru, taught by operators who've done it.</div>
    </div>
    <div class="glass" style="max-width:240px;">
      <div class="eyebrow">By the numbers</div>
      <div class="stat"><div class="num">42</div><div class="lbl">founders<br/>in residence</div></div>
      <div class="stat"><div class="num">12</div><div class="lbl">months<br/>in-person</div></div>
    </div>
  </div>
</div>
</body></html>
