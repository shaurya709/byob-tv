<!doctype html>
<!-- @dsCard group="Colors" name="Primary palette" subtitle="Midnight Charcoal · Soft Mint · Bright Green · Tangerine Glow" viewport="700x160" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg1);font-family:var(--font-sans);}
  .card{padding:20px 24px;width:700px;box-sizing:border-box;}
  .row{display:flex;gap:10px;align-items:stretch;}
  .sw{flex:1;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:88px;border:1px solid var(--border);}
  .sw .name{font:var(--t-caption);font-weight:700;}
  .sw .hex{font:var(--t-caption);font-family:var(--font-mono);opacity:.8;}
  .eyebrow{font:var(--t-overline);letter-spacing:var(--track-overline);text-transform:uppercase;color:var(--fg3);margin-bottom:10px;}
</style></head><body>
<div class="card">
  <div class="eyebrow">Primary palette</div>
  <div class="row">
    <div class="sw" style="background:#112121;color:#fff;border-color:transparent"><div class="name">Midnight Charcoal</div><div class="hex">#112121</div></div>
    <div class="sw" style="background:#E4F3E7;color:#112121"><div class="name">Soft Mint</div><div class="hex">#E4F3E7</div></div>
    <div class="sw" style="background:#6ED190;color:#112121;border-color:transparent"><div class="name">Bright Green</div><div class="hex">#6ED190</div></div>
    <div class="sw" style="background:#F6AF65;color:#112121;border-color:transparent"><div class="name">Tangerine Glow</div><div class="hex">#F6AF65</div></div>
  </div>
</div>
</body></html>
