<!doctype html>
<!-- @dsCard group="Brand" name="Brand element · quote mark" subtitle="Correct quote-mark shape from brand reference" viewport="700x260" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#0B2E2A;font-family:var(--font-sans);color:#fff;}
  .card{width:700px;box-sizing:border-box;padding:20px 24px;}
  .eyebrow{font:var(--t-overline);text-transform:uppercase;letter-spacing:.12em;color:#AFCBB5;margin-bottom:16px;}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 8px;background:rgba(228,243,231,0.04);border-radius:14px;min-height:180px;justify-content:center;}
  .mark{width:140px;height:auto;display:block;}
  .lbl{font-size:12px;font-weight:600;color:#F6AF65;text-transform:uppercase;letter-spacing:.08em;}
</style></head><body>
<div class="card">
  <div class="eyebrow">Brand element · three variants</div>
  <div class="row">
    <div class="cell"><img class="mark" src="../assets/brand-mark-filled-concentric-green.svg" alt=""><div class="lbl">Filled Concentric</div></div>
    <div class="cell"><img class="mark" src="../assets/brand-mark-solid-green.svg" alt=""><div class="lbl">Solid</div></div>
    <div class="cell"><img class="mark" src="../assets/brand-mark-lined-concentric-green.svg" alt=""><div class="lbl">Lined Concentric</div></div>
  </div>
</div>
</body></html>
