<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary · tangerine · secondary · ghost · pill" viewport="700x120" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--bg);font-family:var(--font-sans);}
.card{padding:22px 26px;width:700px;box-sizing:border-box;display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.btn{font-family:var(--font-sans);font-weight:600;font-size:15px;padding:12px 20px;border-radius:10px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,transform .1s;}
.primary{background:#6ED190;color:#112121;}
.primary:hover{background:#43AF68;}
.secondary{background:transparent;color:#112121;border:1px solid rgba(17,33,33,0.24);}
.secondary:hover{background:rgba(17,33,33,0.06);}
.tangerine{background:#F6AF65;color:#112121;}
.ghost{background:transparent;color:#112121;padding:12px 8px;text-decoration:underline;text-underline-offset:4px;}
.pill{background:#11403B;color:#E4F3E7;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;}
</style></head><body>
<div class="card">
  <button class="btn primary">Apply for Cohort 02 →</button>
  <button class="btn tangerine">Download brochure</button>
  <button class="btn secondary">Learn more</button>
  <button class="btn ghost">Read the FAQ</button>
  <span class="pill">Rolling admissions</span>
</div>
</body></html>
